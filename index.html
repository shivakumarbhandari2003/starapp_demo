<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>STARAPP — StarApp</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><polygon points='12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2' fill='%2317345C'/></svg>">

  <!-- StarApp Design System & Liquid-Glass Styling -->
  <link rel="stylesheet" href="css/design_tokens.css?v=23">
  <link rel="stylesheet" href="css/liquid_glass.css?v=23">
  <link rel="stylesheet" href="css/layout.css?v=23">
  <link rel="stylesheet" href="css/components.css?v=23">
  <link rel="stylesheet" href="css/responsive.css?v=23">

  <!-- App Configuration & Backend API Client -->
  <script src="js/api.js?v=23"></script>
  <script>
    window.__STARAPP_CONFIG__ = window.__STARAPP_CONFIG__ || {};
    window.__STARAPP_CONFIG__.USE_BACKEND_API = true;
    /* STARAPP_SERVER_FLAGS */
    try {
      var _savedBoot = sessionStorage.getItem("starapp_fastapi_session");
      if ((_savedBoot && JSON.parse(_savedBoot).user_id) || window.location.search.indexOf("role=") !== -1) {
        document.documentElement.classList.add("starapp-restoring-session");
      }
    } catch (e) {}
  </script>
  <style>html.starapp-restoring-session #app-root { opacity: 0; }</style>

  <!-- StarApp UI Bridge (Pyodide & starapp_bundle.js are lazy-loaded only in offline/static mode) -->
  <script src="js/bridge.js?v=23"></script>
</head>
<body>

  <!-- ========================================================================
       ROOT APPLICATION MOUNT POINT
       ======================================================================== -->
  <div id="app-root">
    <!-- STARAPP_INITIAL_ROOT_START -->
    <!-- Frosted Liquid Glass Loading State during Pyodide initialization -->
    <div style="min-height: 100vh; display: flex; align-items: center; justify-content: center; width: 100%; padding: 24px;">
      <div class="liquid-glass-card" style="max-width: 480px; width: 100%; padding: 32px; text-align: center;">
        <div class="brand-badge" style="width: 56px; height: 56px; margin: 0 auto 16px;">
          <svg viewBox="0 0 24 24" style="width: 32px; height: 32px; fill: var(--snow-white);"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
        </div>
        <h2 style="font-size: 1.4rem; font-weight: 800; color: var(--frost-navy); margin-bottom: 8px;">StarApp Academy</h2>
        <p style="font-size: 13.5px; color: var(--frost-navy-50); margin-bottom: 24px;" id="loading-status-text">
          Loading client-side Python Pyodide runtime...
        </p>
        <div style="height: 6px; border-radius: var(--radius-full); background: rgba(157, 183, 213, 0.3); overflow: hidden;">
          <div id="loading-progress-bar" style="height: 100%; width: 35%; border-radius: var(--radius-full); background: linear-gradient(90deg, var(--deep-frozen-midnight) 0%, var(--icy-steel) 100%); transition: width 300ms ease;"></div>
        </div>
        <div style="font-size: 11px; color: var(--frost-navy-50); margin-top: 14px;">
          Zero backend required • Browser-local execution & persistence
        </div>
      </div>
    </div>
    <!-- STARAPP_INITIAL_ROOT_END -->
  </div>

  <!-- ========================================================================
       PYODIDE BOOTSTRAPPER & PYTHON CONTROLLER INITIALIZATION
       ======================================================================== -->
  <script>
    const STARAPP_OFFLINE_PYODIDE_URL = "https://cdn.jsdelivr.net/pyodide/v0.26.2/full/pyodide.js";
    const STARAPP_OFFLINE_BUNDLE_URL = "js/starapp_bundle.js?v=23";

    function loadScriptOnce(src) {
      return new Promise((resolve, reject) => {
        const existing = Array.from(document.scripts).find((s) => s.src && s.src.includes(src.split("?")[0]));
        if (existing) {
          resolve();
          return;
        }
        const script = document.createElement("script");
        script.src = src;
        script.async = false;
        script.onload = () => resolve();
        script.onerror = (err) => reject(err);
        document.head.appendChild(script);
      });
    }

    async function initializeStarApp() {
      const statusText = document.getElementById("loading-status-text");
      const progressBar = document.getElementById("loading-progress-bar");
      const urlParams = new URLSearchParams(window.location.search);
      const requestedRole = urlParams.get("role");

      let savedSessionState = null;
      try {
        const rawSaved = sessionStorage.getItem("starapp_fastapi_session");
        if (rawSaved) savedSessionState = JSON.parse(rawSaved);
      } catch (e) {}

      // 0a. Fast-path unauthenticated SSR Login: zero API calls needed before user signs in
      if (window.__STARAPP_CONFIG__.SSR_LOGIN && !requestedRole && !(savedSessionState && savedSessionState.user_id)) {
        return;
      }

      // 0b. Authenticated or role-hinted FastAPI boot: single /api/v1/dispatch call (no extra /api/health roundtrip)
      try {
        let sid = sessionStorage.getItem("starapp_window_session_id");
        if (!sid) {
          sid = (requestedRole ? requestedRole + "_" : "win_") + Date.now() + "_" + Math.random().toString(36).slice(2, 8);
          sessionStorage.setItem("starapp_window_session_id", sid);
        }
        if (progressBar) progressBar.style.width = "75%";
        if (statusText) statusText.innerText = "Connecting to FastAPI backend & SQLite3...";
        const dispatchResp = await fetch("/api/v1/dispatch", {
          method: "POST",
          cache: "no-store",
          headers: {
            "Content-Type": "application/json",
            "X-Session-Id": sid
          },
          body: JSON.stringify({
            action: "boot",
            payload: JSON.stringify({
              role: requestedRole || "",
              restore_session: savedSessionState
            }),
            session_id: sid
          })
        });
        if (dispatchResp.ok) {
          const ctype = dispatchResp.headers.get("content-type") || "";
          if (ctype.includes("application/json")) {
            const data = await dispatchResp.json();
            if (data && data.session_state && data.session_state.user_id) {
              try { sessionStorage.setItem("starapp_fastapi_session", JSON.stringify(data.session_state)); } catch (e) {}
            }
            if (data && data.regions) {
              window.StarAppBridge.updateRegions(JSON.stringify(data.regions));
            } else if (data && data.full_html) {
              window.StarAppBridge.updateAppRoot(data.full_html);
            }
            document.documentElement.classList.remove("starapp-restoring-session");
            return;
          }
        }
      } catch (backendErr) {
        document.documentElement.classList.remove("starapp-restoring-session");
        console.log("[StarApp] FastAPI backend not available, falling back to browser Pyodide runtime:", backendErr);
      }
      document.documentElement.classList.remove("starapp-restoring-session");

      try {
        if (progressBar) progressBar.style.width = "30%";
        if (statusText) statusText.innerText = "Loading offline Pyodide Python VM & SQLite bundle...";

        if (typeof loadPyodide !== "function") {
          await loadScriptOnce(STARAPP_OFFLINE_PYODIDE_URL);
        }
        if (!window.__STARAPP_PYTHON_MODULES__) {
          await loadScriptOnce(STARAPP_OFFLINE_BUNDLE_URL);
        }

        if (progressBar) progressBar.style.width = "40%";
        if (statusText) statusText.innerText = "Initializing WebAssembly Python VM...";

        // 1. Initialize Pyodide WebAssembly client-side runtime
        const pyodide = await loadPyodide();

        // 1.1 Load unvendored SQLite3 package for Pyodide
        if (progressBar) progressBar.style.width = "55%";
        if (statusText) statusText.innerText = "Loading SQLite WebAssembly database engine...";
        try {
          await pyodide.loadPackage("sqlite3");
        } catch (pkgErr) {
          console.warn("[StarApp] pyodide.loadPackage('sqlite3') error:", pkgErr);
          try {
            await pyodide.loadPackage("micropip");
            const micropip = pyodide.pyimport("micropip");
            await micropip.install("sqlite3");
          } catch (mErr) {
            console.warn("[StarApp] micropip install sqlite3 error:", mErr);
          }
        }

        if (progressBar) progressBar.style.width = "70%";
        if (statusText) statusText.innerText = "Mounting StarApp domain architecture in Pyodide virtual FS...";

        // 2. Ensure StarApp Python bundle is loaded; fallback to dynamic fetch if necessary
        if (!window.__STARAPP_PYTHON_MODULES__) {
          console.warn("[StarApp] __STARAPP_PYTHON_MODULES__ not detected on window, fetching js/starapp_bundle.js dynamically...");
          try {
            const resp = await fetch("js/starapp_bundle.js?v=" + Date.now());
            if (resp.ok) {
              const bundleCode = await resp.text();
              const runner = new Function(bundleCode);
              runner();
            }
          } catch (e) {
            console.error("[StarApp] Dynamic bundle fetch failed:", e);
          }
        }

        if (!window.__STARAPP_PYTHON_MODULES__) {
          throw new Error("StarApp Python bundle (js/starapp_bundle.js) could not be loaded. Please ensure the file is present.");
        }

        // Mount StarApp Python modules directly into Pyodide virtual filesystem
        function ensureFsDir(fullPath) {
          if (!fullPath || fullPath === "/" || fullPath === ".") return;
          try {
            if (typeof pyodide.FS.mkdirTree === "function") {
              pyodide.FS.mkdirTree(fullPath);
              return;
            }
          } catch (e) {}
          const isAbs = fullPath.startsWith("/");
          const parts = fullPath.replace(/\\/g, "/").split("/").filter(Boolean);
          let curr = "";
          for (const part of parts) {
            curr = curr ? `${curr}/${part}` : (isAbs ? `/${part}` : part);
            try {
              pyodide.FS.mkdir(curr);
            } catch (e) {}
          }
        }

        ensureFsDir("starapp");
        ensureFsDir("/home/pyodide/starapp");

        for (const [vpath, sourceCode] of Object.entries(window.__STARAPP_PYTHON_MODULES__)) {
          const fname = vpath.replace(/^starapp\//, "");
          const targetPaths = [
            "starapp/" + fname,
            "/home/pyodide/starapp/" + fname
          ];

          for (const targetPath of targetPaths) {
            const lastSlash = targetPath.lastIndexOf("/");
            if (lastSlash > 0) {
              ensureFsDir(targetPath.substring(0, lastSlash));
            }
            try {
              pyodide.FS.writeFile(targetPath, sourceCode);
            } catch (e) {
              console.error("[StarApp] Error writing virtual file:", targetPath, e);
            }
          }
        }

        // Mount Authoritative SQLite Database directly into Pyodide virtual FS
        if (window.__STARAPP_AUTHORITATIVE_SQLITE_B64__) {
          try {
            const binaryStr = atob(window.__STARAPP_AUTHORITATIVE_SQLITE_B64__);
            const bytes = new Uint8Array(binaryStr.length);
            for (let i = 0; i < binaryStr.length; i++) {
              bytes[i] = binaryStr.charCodeAt(i);
            }
            ensureFsDir("data");
            ensureFsDir("/home/pyodide");
            pyodide.FS.writeFile("data/starapp.db", bytes);
            pyodide.FS.writeFile("/home/pyodide/starapp.db", bytes);
            pyodide.FS.writeFile("starapp.db", bytes);
            console.log("[StarApp] Authoritative SQLite database mounted into Pyodide FS (" + bytes.length + " bytes)");
          } catch (e) {
            console.error("[StarApp] Error mounting authoritative SQLite DB:", e);
          }
        }

        if (progressBar) progressBar.style.width = "85%";
        if (statusText) statusText.innerText = "Retrieving local state snapshot from IndexedDB...";

        // 3. Retrieve persistent data and session from IndexedDB / localStorage
        let storedDataJson = await window.StarAppBridge.getStore("data");
        const sessionJson = await window.StarAppBridge.getStore("session");
        let sqliteDbB64 = await window.StarAppBridge.getStore("sqlite_db");

        // Filter out stale legacy synthetic caches if present
        if (storedDataJson && (storedDataJson.includes("Elena Vance") || storedDataJson.includes("badge_gov_101") || storedDataJson.includes("Ada Lovelace") || storedDataJson.includes("AGT-304"))) {
          console.log("[StarApp] Ignoring stale synthetic data from legacy storage");
          storedDataJson = "";
        }
        if (!sqliteDbB64 && window.__STARAPP_AUTHORITATIVE_SQLITE_B64__) {
          sqliteDbB64 = window.__STARAPP_AUTHORITATIVE_SQLITE_B64__;
        }

        window.__STORED_DATA_JSON__ = storedDataJson || "";
        window.__SESSION_DATA_JSON__ = sessionJson || "";
        window.__SQLITE_DB_B64__ = sqliteDbB64 || "";

        if (progressBar) progressBar.style.width = "95%";
        if (statusText) statusText.innerText = "Launching StarApp Controller...";

        // 4. Run Python initialization code with robust sys.path configuration
        await pyodide.runPythonAsync(`
import sys, os
for p in [os.getcwd(), ".", "/home/pyodide", "/"]:
    if p and p not in sys.path:
        sys.path.insert(0, p)

import js
from starapp.app import controller

# Bind controller to global window so the bridge can dispatch actions
js.window.starAppController = controller

# Initialize with persistent store snapshot & authoritative SQLite database
stored_data = js.window.__STORED_DATA_JSON__
session_data = js.window.__SESSION_DATA_JSON__
sqlite_db_b64 = js.window.__SQLITE_DB_B64__
controller.initialize(stored_data, session_data, sqlite_db_b64)
        `);

      } catch (err) {
        console.error("[StarApp] Bootstrap Error:", err);
        if (statusText) {
          statusText.innerHTML = `<span style="color:red; font-weight:700;">Bootstrap failed:</span> ${err.message}<br><small>If network access is restricted in your browser, ensure Pyodide CDN is accessible or launch via <code>python -m http.server</code>.</small>`;
        }
      }
    }

    // Launch on DOM ready
    window.addEventListener("DOMContentLoaded", initializeStarApp);

    // Unregister legacy localhost SW when running via FastAPI backend to eliminate duplicate fetches;
    // keep Service Worker enabled only for standalone static/Pyodide mode.
    if ("serviceWorker" in navigator && window.location.protocol.startsWith("http")) {
      window.addEventListener("load", () => {
        if (window.__STARAPP_CONFIG__ && window.__STARAPP_CONFIG__.FASTAPI_ACTIVE) {
          navigator.serviceWorker.getRegistrations().then((regs) => {
            regs.forEach((reg) => reg.unregister());
          }).catch(() => {});
          return;
        }
        navigator.serviceWorker.register("sw.js").catch((err) => {
          console.warn("[StarApp] Service Worker registration skipped:", err);
        });
      });
    }
  </script>
</body>
</html>
