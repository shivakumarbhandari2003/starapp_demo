<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>STAR App — Interactive ER Mind Map (NotebookLM Style)</title>
  <link rel="stylesheet" href="css/mindmap.css">
</head>
<body>
  <div id="mindmap-app">
    <!-- Header Toolbar -->
    <header class="mindmap-header">
      <div class="brand-section">
        <div class="brand-icon" title="STAR App Database Mind Map">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
            <ellipse cx="12" cy="5" rx="9" ry="3"/>
            <path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"/>
            <path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"/>
          </svg>
        </div>
        <div>
          <div class="brand-title">STAR APP DATABASE</div>
          <div style="font-size: 11px; color: var(--text-muted); font-weight: 500;">Interactive ER Mind Map</div>
        </div>
        <div class="brand-badge" id="canvas-stats-badge">
          <span><strong>29</strong> Tables</span> &bull; <span><strong>8</strong> Modules</span>
        </div>
      </div>

      <!-- Search Input -->
      <div class="search-box-wrapper">
        <div class="search-input-wrap">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
          </svg>
          <input type="text" id="mindmap-search-input" placeholder="Search tables, columns, modules..." autocomplete="off">
          <span class="kbd-shortcut">/</span>
        </div>
        <div class="search-dropdown" id="search-dropdown"></div>
      </div>

      <!-- Header Controls -->
      <div class="header-actions">
        <button type="button" class="btn-ctrl" id="btn-expand-all" title="Expand all modules and tables">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 3 21 3 21 9"/><polyline points="9 21 3 21 3 15"/><line x1="21" y1="3" x2="14" y2="10"/><line x1="3" y1="21" x2="10" y2="14"/></svg>
          Expand All
        </button>
        <button type="button" class="btn-ctrl" id="btn-collapse-all" title="Collapse all branches to clean overview">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="4 14 10 14 10 20"/><polyline points="20 10 14 10 14 4"/><line x1="14" y1="10" x2="21" y2="3"/><line x1="3" y1="21" x2="10" y2="14"/></svg>
          Collapse All
        </button>
        <button type="button" class="btn-ctrl" id="btn-toggle-attrs" title="Toggle showing column schemas directly inside table cards">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18"/><path d="M9 21V9"/></svg>
          <span class="btn-label">Show Card Attributes</span>
        </button>
        <button type="button" class="btn-ctrl active" id="btn-toggle-rels" title="Cycle relationship modes: All (42 Lines) ➔ Focused Table Only ➔ Off">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
          <span class="btn-label">Relationships: All (42 Lines)</span>
        </button>
        <button type="button" class="btn-ctrl" id="btn-toggle-orient" title="Switch layout orientation">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="3" x2="12" y2="21"/><polyline points="6 15 12 21 18 15"/></svg>
          <span class="btn-label">Vertical (T➔B)</span>
        </button>
      </div>
    </header>

    <!-- Main Viewport Canvas -->
    <main id="mindmap-viewport">
      <div id="mindmap-canvas">
        <svg id="mindmap-svg" width="3400" height="2200"></svg>
        <div id="mindmap-nodes"></div>
      </div>
    </main>

    <!-- Floating Navigation & Legend -->
    <div class="mindmap-floating-bottom">
      <div class="ctrl-group">
        <button type="button" class="ctrl-btn" id="btn-zoom-out" title="Zoom Out (-)">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="5" y1="12" x2="19" y2="12"/></svg>
        </button>
        <button type="button" class="ctrl-btn" id="btn-zoom-in" title="Zoom In (+)">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        </button>
        <button type="button" class="ctrl-btn" id="btn-fit-screen" title="Fit to Screen">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/></svg>
        </button>
        <button type="button" class="ctrl-btn" id="btn-reset-view" title="Reset View (100%)">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="2"/></svg>
        </button>
      </div>

      <div class="legend-card">
        <div class="legend-item"><span class="attr-pill pk" style="display:inline-block;">PK</span> Primary Key</div>
        <div class="legend-item"><span class="attr-pill fk" style="display:inline-block;">FK</span> Foreign Key</div>
        <div class="legend-item"><span class="attr-pill derived" style="display:inline-block;">DERIVED</span> Calculated</div>
        <div class="legend-item"><span style="color:#FBBF24; font-weight:800; font-size:10.5px;">1:N</span> One-to-Many</div>
        <div class="legend-item"><span style="color:#10B981; font-weight:800; font-size:10.5px;">1:1</span> One-to-One</div>
        <div class="legend-item"><span style="color:var(--text-dim); font-size:10px;">Click card to reveal attributes &bull; Click FK pill to jump</span></div>
      </div>
    </div>

    <!-- Minimap Radar -->
    <div class="minimap-wrapper" title="Interactive Radar Minimap">
      <canvas id="minimap-canvas" width="180" height="120"></canvas>
    </div>

    <!-- Table Details Side Drawer -->
    <aside id="table-detail-drawer">
      <div class="drawer-header">
        <div>
          <div class="drawer-title">Table Details</div>
          <div class="drawer-subtitle">Schema & Relationships</div>
        </div>
        <button type="button" class="drawer-close-btn" title="Close Drawer (Esc)">&times;</button>
      </div>
      <div class="drawer-body">
        <!-- Rendered dynamically -->
      </div>
    </aside>
  </div>

  <!-- Standard Modular Scripts (Zero CORS, 100% file:// compatible) -->
  <script src="js/schema-data.js"></script>
  <script src="js/relationships.js"></script>
  <script src="js/layout-engine.js"></script>
  <script src="js/mindmap-renderer.js"></script>
  <script src="js/interactions.js"></script>
  <script src="js/search.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
